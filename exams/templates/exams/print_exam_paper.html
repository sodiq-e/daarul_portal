{% extends 'base.html' %}

{% block title %}Exam Paper - {{ exam_paper.subject }}{% endblock %}

{% block extra_css %}
<style>
  :root {
    --paper-font-size: {{ font_size|default:'12pt' }};
  }
  header .header-center a > div:first-child,
  .school-name {
    font-size: 22px !important;
    font-weight: bold;
    line-height: 1.1;
    margin: 4px 0;
  }
  #exam-paper {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 34px;
    background: #fff;
    color: #111;
    font-family: Arial, sans-serif;
    font-size: var(--paper-font-size);
  }
  .exam-paper-title {
    margin: 0 0 10px;
    font-size: 1.15em;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
  }
  .exam-paper-meta {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 4px 14px;
    margin-bottom: 8px;
    font-size: 0.85em;
    font-weight: 600;
    text-transform: uppercase;
  }
  .exam-paper-meta > div {
    min-width: 0;
  }
  .exam-paper-instructions {
    margin: 8px 0 14px;
    font-weight: 700;
    text-align: center;
    text-transform: uppercase;
  }
  .exam-paper-section {
    margin: 0 0 22px;
  }
  .exam-paper-section-title {
    margin: 0 0 8px;
    font-size: 1em;
    font-weight: 700;
    text-transform: uppercase;
  }
  .exam-paper-section-instruction {
    margin: 0 0 12px;
  }
  .exam-paper-question {
    position: relative;
    margin: 0 0 14px;
    padding-left: 1.8rem;
    break-inside: avoid;
  }
  .exam-paper-question-number {
    position: absolute;
    left: 0;
    font-weight: 700;
  }
  .exam-paper-question-content p {
    margin: 0 0 0.45em;
  }
  .exam-paper-question-content figure.image {
    display: inline-block;
    max-width: 120px !important;
    max-height: 90px;
    margin: 0 0.2em;
    vertical-align: middle;
  }
  .exam-paper-question-content figure.image img {
    display: block;
    width: 100%;
    max-width: 120px !important;
    max-height: 90px !important;
    height: auto;
  }
  .exam-paper-question-content img {
    display: inline-block;
    max-width: 120px !important;
    max-height: 90px !important;
    height: auto;
    vertical-align: middle;
    object-fit: contain;
  }
  .exam-paper-options {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 14px;
    margin: 5px 0 0;
  }
  .exam-paper-option {
    flex: 0 1 auto;
    max-width: 100%;
    break-inside: avoid;
  }
  .exam-paper-marks {
    margin: 4px 0 0;
    text-align: right;
    font-size: 0.9em;
  }
  .exam-paper-resource {
    margin: 8px 0 0;
  }
  @media print {
    @page {
      margin: 6mm 10mm 10mm;
    }
    @page :first {
      margin-top: 3mm;
    }
    body {
      margin: 0 !important;
      padding: 0 !important;
      background: #fff !important;
      color: #000 !important;
    }
    body header {
      display: block !important;
      visibility: visible !important;
      position: static !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 0 2px !important;
      border-bottom: 1px solid #222 !important;
    }
    header .header-container {
      display: flex !important;
      grid-template-columns: none !important;
      justify-content: center !important;
      gap: 14px !important;
      min-height: 0 !important;
      padding: 0 !important;
    }
    header .header-left img {
      width: auto !important;
      height: 72px !important;
      max-width: 110px !important;
      max-height: 72px !important;
      filter: contrast(1.25) saturate(1.1) !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    header .header-center {
      flex: 1 !important;
      width: auto !important;
      grid-column: auto !important;
      text-align: center !important;
    }
    header .header-center a > div:first-child {
      font-size: 30px !important;
      font-weight: 900 !important;
      line-height: 1.05 !important;
    }
    header .header-center > div:nth-child(2) {
      font-size: 12px !important;
    }
    header .header-center div[style*="font-size:11px"] {
      font-size: 9px !important;
    }
    header .header-right,
    .skip-link,
    header .menu-btn,
    .sidebar,
    .mobile-bottom-nav,
    .breadcrumb,
    .breadcrumb-navigation,
    .page-loader,
    .announcement-ticker,
    .theme-customizer,
    .toast-container,
    nav,
    aside,
    .no-print {
      display: none !important;
    }
    .container-fluid,
    #exam-paper {
      display: block !important;
      width: auto !important;
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      box-shadow: none !important;
      background: #fff !important;
    }
    .exam-paper-meta {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    }
    .exam-paper-options {
      display: flex !important;
    }
    .exam-paper-question-content img {
      max-width: 120px !important;
      max-height: 90px !important;
      height: auto !important;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid mt-3 mb-5">
  {% include 'exams/partials/exam_paper_content.html' %}
</div>
{% endblock %}
