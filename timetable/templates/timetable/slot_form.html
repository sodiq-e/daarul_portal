{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 760px">
  <a class="text-decoration-none" href="{% url 'timetable:detail' timetable.pk %}"><i class="fas fa-arrow-left me-1"></i>Back to timetable</a>
  <div class="card border-0 shadow-sm mt-3">
    <div class="card-body p-4">
      <h1 class="h2">{{ title }}</h1>
      <p class="text-muted">Use 12-hour display in the grid. The browser stores the time accurately as 24-hour time.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Add row</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
