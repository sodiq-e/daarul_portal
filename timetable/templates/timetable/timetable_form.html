{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 760px">
  <a class="text-decoration-none" href="{% url 'timetable:list' %}"><i class="fas fa-arrow-left me-1"></i>Back to timetables</a>
  <div class="card border-0 shadow-sm mt-3">
    <div class="card-body p-4">
      <h1 class="h2">{{ title }}</h1>
      <p class="text-muted">A new template starts with Monday to Saturday. Friday is marked as a short day and can be adjusted in the grid.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Create template</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
