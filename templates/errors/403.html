{% extends 'base.html' %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <section class="portal-empty-state text-center" role="alert">
                <i class="fas fa-lock text-muted mb-3" aria-hidden="true"></i>
                <h1>Access denied</h1>
                <p>{{ message }}</p>
                <a href="{{ return_url }}" class="btn btn-primary">{{ return_label }}</a>
            </section>
        </div>
    </div>
</div>
{% endblock %}
