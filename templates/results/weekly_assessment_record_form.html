{% extends 'base.html' %}

{% block title %}Edit Weekly Assessment{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Weekly Assessment</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Student</label>
                        <input type="text" class="form-control" value="{{ record.student.full_name }}" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Subject</label>
                        <input type="text" class="form-control" value="{{ record.class_subject.subject.name }}" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Week</label>
                        <input type="number" class="form-control" name="week_number" value="{{ record.week_number }}" min="1">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Assessment Type</label>
                        <select name="assessment_type" class="form-select">
                            {% for value, label in record.ASSESSMENT_TYPES %}
                            <option value="{{ value }}" {% if record.assessment_type == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Assessment Date</label>
                        <input type="date" class="form-control" name="assessment_date" value="{{ record.assessment_date|date:'Y-m-d' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Score</label>
                        <input type="number" step="0.01" min="0" class="form-control" name="score" value="{{ record.score }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Out Of</label>
                        <input type="number" step="0.01" min="1" class="form-control" name="out_of" value="{{ record.out_of }}">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Remarks</label>
                        <input type="text" class="form-control" name="remarks" value="{{ record.remarks }}">
                    </div>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{% url 'teacher_weekly_assessment_view' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
